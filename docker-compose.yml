version: "3.9"

services:
  redis:
    image: redis:7

  api:
    image: python:3.12
    env_file:
      - .env
    volumes:
      - .:/app
    working_dir: /app/api
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  worker:
    image: python:3.12
    volumes:
      - .:/app
    working_dir: /app/worker
    command: >
      sh -c "pip install -r requirements.txt &&
             python worker.py"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
